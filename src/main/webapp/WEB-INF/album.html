<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<link rel="stylesheet" type="text/css" media="all"
	href="css/bootstrap.min.css" th:href="@{css/bootstrap.min.css}" />
<link rel="stylesheet" type="text/css" media="all"
	href="css/albumStyle.css" th:href="@{css/albumStyle.css}" />
<meta charset="ISO-8859-1">
<title th:text = "${album.title}">Title of the album</title>
</head>
<body>
	


	<nav class="navbar navbar-expand-sm bg-primary navbar-dark">
  	<ul class="navbar-nav">
    	<li class="nav-item active">
      	<a class="nav-link" th:href="@{/Home}">Back</a>
    	</li>
    	<li class="nav-item">
      	<a class="nav-link" th:href="@{/Login}">Logout</a>
    	</li>
  	</ul>
	</nav>
	
	<table th:if="${not #lists.isEmpty(images)}">
		<tbody class="original">	
		<tr>
			<td th:if="${currentPage} > 1"><a th:href="@{/Album(album = ${album.id}, page = ${currentPage - 1} , img = -1)}"><input class = "btn btn-primary"type="submit" value="<"></a></td>
			
				<td th:each = "image: ${images}">
					<p th:text = "${image.title}">title</p>	
				
					<a th:href="@{/Album(album = ${album.id}, page = ${currentPage}, img = ${imageStat.index})}" class="animation background">
						<img th:src="@{|${image.source}|}" class="thumb">
					</a>
				</td>
			
			<td th:if="${currentPage + 1}  <= ${pageCount}"><a th:href="@{/Album(album = ${album.id}, page = ${currentPage + 1}, img = -1)}"><input class = "btn btn-primary" type="submit" value=">"></a></td>
		</tr>	
		</tbody>
		
		
	</table>
	
	
	<form class = "form-inline"th:action="@{/Upload}" method="post"enctype="multipart/form-data">
	
	
		<h3>Upload a new image</h3>
		<input type="hidden" name="albumId" th:value="${album.id}" required />
		<input class = "form-control" type="file" name="image" required />
		<input class = "form-control"type="text" name="title" placeholder="title" required />
		<input class = "form-control"type="text" name="description" placeholder="description" required />
		<input class = "btn btn-primary" type="submit" value="Upload" />
		
	</form>
	
		<img th:if="${imageIndex != -1}" th:src="@{|${images[imageIndex].source}|}"  class="original"/>
        <table th:if="${imageIndex != -1}" class ="details" >
            <tbody>
            	<tr>
                    <th>Title</th><td th:text="${images[imageIndex].title}"></td>
                </tr>
                <tr>	   
                    <th>Date</th><td th:text="${images[imageIndex].date}"></td>
                </tr>
                <tr>    
                    <th>Description</th><td th:text="${images[imageIndex].description}"></td>
                </tr>
                <tr>
                	<td>
                	<h3>inserisci un commento</h3>
                		<form th:action="@{/Comments(user = session.user, image = ${images[imageIndex].id}, album = ${album.id}, currentPage = ${currentPage}, img=${imageIndex})}" method="post">
							<input type="text" name="text" placeholder="inserisci commento..." required /><input type="submit"/>

						</form>
					</td>
				</tr>		
            </tbody>          
        </table>
        
        
		
        <table th:if="${not #lists.isEmpty(images[imageIndex].comments)}" class="comments">
		<tbody>
		<tr th:each = "comment: ${images[imageIndex].comments}">
			<td >
				<p th:text = "${comment.userName}"></p>	
				<p th:text = "${comment.text}"></p>
			</td>
		</tr>	
		</tbody>
		
		
	</table>
 
	

	

</body>
</html>
