<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<link rel="stylesheet" type="text/css" media="all"
	href="css/loginStyle.css" th:href="@{css/loginStyle.css}" />
<meta charset="ISO-8859-1">
<title th:text = "${album.title}">Title of the album</title>
</head>
<body>
	
	
	<h1 th:text = "${pageCount}"></h1>

	
	<table th:if="${not #lists.isEmpty(images)}">
		<tbody>
		
		<!-- add image details link -->
		
		<tr>
			<td th:each = "image: ${images}">
				<p th:text = "${image.title}">title</p>	
				<img th:src="@{|${image.source}|}" class="thumb">
				<a th:href="@{/Album(album = ${album.id}, page = 1, img = 2)}" class="animation background">SHOW</a>
			</td>
		</tr>	
		</tbody>
		
		
	</table>
	
	<h1 th:text = "${imageIndex}">index</h1>
	
        <table th:if="${imageIndex != -1}" id="tableDetail">
            <caption>Image selected:</caption>

            <tbody>

                    <tr th:text="${images[imageIndex].title}">title</tr>
                    <th>Date</th><td th:text="${images[imageIndex].date}">2020-02-02</td>
                <tr>
                    <th>Description</th><td th:text="${images[imageIndex].description}">This is a description</td>
                </tr>
                <tr>
                    <img th:src="@{|${images[imageIndex].source}|}"  class="original"/></td>
                </tr>
            </tbody>
        </table>
 
	

	<form th:action="@{/Upload}" method="post"enctype="multipart/form-data">
	
		<input type="hidden" name="albumId" th:value="${album.id}" required />
		<input type="file" name="image" required />
		<input type="text" name="title" required />
		<input type="text" name="description" required />
		<input type="submit" value="Upload" />
		
	</form>

</body>
</html>
